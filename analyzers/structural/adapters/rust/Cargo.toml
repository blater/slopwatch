[package]
name = "slopslap-structural-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
publish = false

[[bin]]
name = "slopslap-structural-rust"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
syn = { version = "=1.0.107", features = ["full", "parsing", "visit"] }
