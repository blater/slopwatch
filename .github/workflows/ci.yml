name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: analyzers/typescript/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Test clean builds, analyzers, application, and settings
        shell: bash
        run: |
          set -euo pipefail
          go -C go mod download
          make build

      - name: Upload validated distribution
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: slopwatch-validated-${{ github.sha }}
          path: |
            dist/slopwatch-dev-darwin-arm64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
