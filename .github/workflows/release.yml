name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or republish, such as v0.2.0
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag and secret
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error title=Invalid release tag::$RELEASE_TAG must use vX.Y.Z"
            exit 1
          }
          [[ -n "$HOMEBREW_TAP_TOKEN" ]] || {
            echo "::error title=Missing HOMEBREW_TAP_TOKEN::Configure the tap token before releasing."
            exit 1
          }
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Retrieve CI-validated distribution for release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLOPWATCH_SOURCE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: ./util/download-release-artifact.sh "$VERSION"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/slopwatch-${VERSION}-darwin-arm64.tar.gz" dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" "dist/slopwatch-${VERSION}-darwin-arm64.tar.gz" dist/SHA256SUMS \
              --verify-tag \
              --title "Slopwatch $VERSION" \
              --generate-notes
          fi

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SLOPWATCH_RELEASE_VERSION: ${{ env.VERSION }}
        run: |
          gh auth setup-git --hostname github.com --force
          ./util/build_brew
