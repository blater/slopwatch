[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "slopslap"
version = "0.1.0"
description = "A stateless multi-language design-debt scorer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0,<3",
  "textual>=8.2,<9",
  "tomli>=2.0; python_version < '3.11'",
  "watchfiles>=1.2,<2",
]

[project.scripts]
slopslap = "slopslap:cli"
slopslap-mcp = "slopslap_mcp:main"

[tool.setuptools]
py-modules = ["slopslap", "slopslap_build", "slopslap_mcp"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["slopslap_app*", "slopslap_core*", "slopslap_runtime*", "analyzers*"]

[tool.setuptools.package-data]
"analyzers" = [
  "java/pom.xml",
  "java/*.xml",
  "java/src/main/java/dev/slopslap/pmd/*.java",
  "typescript/package.json",
  "typescript/package-lock.json",
  "typescript/tsconfig.json",
  "typescript/src/*.ts",
  "typescript/test/*.ts",
  "typescript/test/fixtures/*",
  "structural/go.mod",
  "structural/README.md",
  "structural/adapters/rust/Cargo.toml",
  "structural/adapters/rust/Cargo.lock",
  "structural/adapters/rust/src/*.rs",
  "structural/adapters/java/src/dev/slopslap/structural/*.java",
  "structural/cmd/slopslap-structural/*.go",
  "structural/internal/adapters/*.go",
  "structural/internal/facts/*.go",
  "structural/internal/goadapter/*.go",
  "structural/internal/javaadapter/*.go",
  "structural/internal/metrics/*.go",
  "structural/internal/rustadapter/*.go",
]
"slopslap_core" = ["component-catalog.json"]
