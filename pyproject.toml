[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smellscout"
version = "0.1.0"
description = "A stateless Java design-debt scorer and quality gate for coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]

[project.scripts]
smellscout = "smellscout:cli"
smellscout-mcp = "smellscout_mcp:main"

[tool.setuptools]
py-modules = ["smellscout", "smellscout_mcp"]

[tool.setuptools.data-files]
"share/smellscout" = ["smellscout-ruleset.xml"]
