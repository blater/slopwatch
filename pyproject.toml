[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopslap"
version = "0.1.0"
description = "A stateless multi-language design-debt scorer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0,<3",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
slopslap = "slopslap:cli"
slopslap-mcp = "slopslap_mcp:main"

[tool.setuptools]
py-modules = ["slopslap", "slopslap_mcp"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["slopslap_app*", "slopslap_core*", "slopslap_runtime*", "analyzers*"]

[tool.setuptools.package-data]
"analyzers" = [
  "java/pom.xml",
  "java/*.xml",
  "java/src/main/java/dev/slopslap/pmd/*.java",
  "typescript/package.json",
  "typescript/package-lock.json",
  "typescript/tsconfig.json",
  "typescript/src/*.ts",
  "typescript/test/*.ts",
  "typescript/test/fixtures/*",
  "rust/Cargo.toml",
  "rust/Cargo.lock",
  "rust/src/*.rs",
]
"slopslap_core" = ["component-catalog.json"]
