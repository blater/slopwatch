name: Slopslap
description: Analyze Go, Java, TypeScript, and Rust design debt with Slopslap.
inputs:
  pass-score:
    description: Pass files scoring at or below this value; omit to report only.
    required: false
  path:
    description: Project directory to analyse.
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Install Slopslap
      shell: bash
      run: python3 -m pip install "$GITHUB_ACTION_PATH"
    - name: Install required analysis drivers
      shell: bash
      env:
        SLOPSLAP_PATH: ${{ inputs.path }}
      run: |
        if [[ -n "$(find "$SLOPSLAP_PATH" -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.mts' -o -name '*.cts' \) -print -quit)" ]]; then
          slopslap install typescript
        fi
    - name: Analyze design debt
      shell: bash
      env:
        SLOPSLAP_PASS_SCORE: ${{ inputs.pass-score }}
        SLOPSLAP_PATH: ${{ inputs.path }}
      run: |
        if [[ -n "$SLOPSLAP_PASS_SCORE" ]]; then
          slopslap "$SLOPSLAP_PATH" --pass-score "$SLOPSLAP_PASS_SCORE"
        else
          slopslap "$SLOPSLAP_PATH"
        fi
