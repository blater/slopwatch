name: Slopscout
description: Analyze Java, TypeScript, and Rust design debt with Slopscout.
inputs:
  pass-score:
    description: Pass files scoring at or below this value; omit to report only.
    required: false
  path:
    description: Project directory to analyse.
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Install Slopscout
      shell: bash
      run: python3 -m pip install "$GITHUB_ACTION_PATH"
    - name: Install required analysis drivers
      shell: bash
      env:
        SLOPSCOUT_PATH: ${{ inputs.path }}
      run: |
        if [[ -n "$(find "$SLOPSCOUT_PATH" -type f -name '*.java' -print -quit)" ]]; then
          slopscout install java
        fi
        if [[ -n "$(find "$SLOPSCOUT_PATH" -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.mts' -o -name '*.cts' \) -print -quit)" ]]; then
          slopscout install typescript
        fi
        if [[ -n "$(find "$SLOPSCOUT_PATH" -type f -name '*.rs' -print -quit)" ]]; then
          slopscout install rust
        fi
    - name: Analyze design debt
      shell: bash
      env:
        SLOPSCOUT_PASS_SCORE: ${{ inputs.pass-score }}
        SLOPSCOUT_PATH: ${{ inputs.path }}
      run: |
        if [[ -n "$SLOPSCOUT_PASS_SCORE" ]]; then
          slopscout "$SLOPSCOUT_PATH" --pass-score "$SLOPSCOUT_PASS_SCORE"
        else
          slopscout "$SLOPSCOUT_PATH"
        fi
