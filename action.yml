name: Slopslap
description: Analyze Go, Java, TypeScript, and Rust design debt with Slopslap.
inputs:
  pass-score:
    description: Pass files scoring at or below this value; omit to report only.
    required: false
  path:
    description: Project directory to analyse.
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Build bundled analyzers
      shell: bash
      run: make -C "$GITHUB_ACTION_PATH" build
    - name: Analyze design debt
      shell: bash
      env:
        SLOPSLAP_PASS_SCORE: ${{ inputs.pass-score }}
        SLOPSLAP_PATH: ${{ inputs.path }}
      run: |
        if [[ -n "$SLOPSLAP_PASS_SCORE" ]]; then
          "$GITHUB_ACTION_PATH/build/slopmark" "$SLOPSLAP_PATH" --pass-score "$SLOPSLAP_PASS_SCORE"
        else
          "$GITHUB_ACTION_PATH/build/slopmark" "$SLOPSLAP_PATH"
        fi
